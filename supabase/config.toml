# Only overriding what needs overriding — every other function keeps the
# default (verify_jwt = true), since they're all called from the UGIS
# frontend with a real Supabase session. This one is called directly by
# Shopify, which has no Supabase-issued JWT to present; it verifies
# authenticity itself via HMAC instead (see the function's own comments).
[functions.shopify-webhook-orders-paid]
verify_jwt = false

# Same reasoning as shopify-webhook-orders-paid above — called directly by
# Shopify, HMAC-verified instead of JWT-checked.
[functions.shopify-webhook-products-update]
verify_jwt = false

[functions.shopify-webhook-products-delete]
verify_jwt = false

[functions.shopify-webhook-store-credit]
verify_jwt = false

# One-time setup utility, meant to be run once via plain curl (no staff
# login needed) then deleted — see the function's own comments. Takes no
# user-supplied input (the callback URL is hardcoded), so the worst case of
# leaving it reachable is a harmless duplicate webhook subscription attempt,
# but it shouldn't be left lying around indefinitely regardless.
[functions.shopify-register-webhook]
verify_jwt = false
